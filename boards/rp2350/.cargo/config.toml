[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv6m-none-eabi]
#runner = "elf2uf2-rs -d"
#runner = "picotool load -x -t elf"
#runner = "probe-run --probe xiao-rp2040 --chip RP2040" # Program target with rust-dap on XIAO RP2040 (for rust-dap RP2040 development board)
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=--nmagic"]

[target.thumbv8m.main-none-eabihf]
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "target-cpu=cortex-m33",
]

[target.riscv32imac-unknown-none-elf]
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Trp235x_riscv.x",
    "-C", "link-arg=-Tdefmt.x",
]