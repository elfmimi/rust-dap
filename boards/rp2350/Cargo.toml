[package]
name = "rust-dap-bare-rp2350"
version = "0.1.0"
authors = ["Ein Terakawa <applause@elfmimi.jp>"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
cortex-m = { version = "0.7" }
cortex-m-rt = "0.7"
panic-halt = "0.2"
rp235x-hal = { version = "0.2.0", features = ["binary-info", "critical-section-impl", "rt", "defmt"]}
rust-dap = { path = "../../rust-dap", features = ["bitbang"] }

embedded-hal = "1.0.0"
